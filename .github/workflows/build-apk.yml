name: Build FPL Widget APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Keep one signing key between future V2 builds so newer APKs can install
      # over older V2 APKs instead of forcing an uninstall every time.
      - name: Restore V2 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fplwidget-v2-debug-keystore

      - name: Create signing key if needed
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=GB" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Extract V2 project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q FPLWidgetProject.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/FPLPointsWidget
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPLWidget-V2-APK
          path: buildsrc/FPLPointsWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

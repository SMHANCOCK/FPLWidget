<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPL Points Widget Preview</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#efeff3;font-family:Arial,sans-serif;padding:24px}
  .phone{width:min(430px,100%);background:#fafafa;border-radius:38px;padding:56px 18px 36px;box-shadow:0 20px 60px #0002;position:relative}
  .widget{background:#171326;border-radius:24px;color:#fff;padding:18px;box-shadow:0 8px 24px #0002}
  .top{display:flex;gap:16px;align-items:center}.left{flex:1}.green{color:#00ff87}.muted{color:#b9b3c9}.eyebrow{font-weight:800;font-size:12px;letter-spacing:.3px}.points{font-size:54px;font-weight:900;line-height:.9;margin-top:8px}.label{font-size:10px;font-weight:800;margin-top:6px}.right{text-align:right;font-size:13px;line-height:1.5}.rank{font-weight:800}.refresh{margin-top:7px;font-weight:800;font-size:12px}.footer{font-size:9px;margin-top:10px}.note{font-size:12px;color:#555;margin-top:18px;text-align:center}
</style>
</head>
<body>
  <div class="phone">
    <div class="widget">
      <div class="top">
        <div class="left">
          <div class="eyebrow green">GW3 • STEVE'S XI</div>
          <div class="points">67</div>
          <div class="label muted">LIVE POINTS</div>
        </div>
        <div class="right">
          <div class="rank">Overall 812,421</div>
          <div>GW 346,210</div>
          <div class="muted">7 done • 4 left</div>
          <div class="refresh green">↻ Refresh</div>
        </div>
      </div>
      <div class="footer muted">Updated 15:09 • live estimate</div>
    </div>
    <div class="note">Preview only - the real widget pulls your FPL data.</div>
  </div>
</body>
</html>
